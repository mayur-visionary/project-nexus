<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:'Montserrat',-apple-system,sans-serif;background:#F2FEDC;color:#434343;min-height:100vh;font-size:12px;overflow-x:hidden}

/* ── Login ── */
.login-overlay{position:fixed;inset:0;background:#473400;z-index:9999;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:40px 44px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.25);border-top:3px solid #FFDA30;text-align:center}
.login-eyebrow{font-size:9px;font-weight:700;letter-spacing:.18em;color:#9A9A9A;text-transform:uppercase;margin-bottom:5px}
.login-title{font-size:20px;font-weight:800;color:#434343;text-transform:uppercase;letter-spacing:.05em;margin-bottom:26px}
.login-input{width:100%;padding:12px 16px;border:1.5px solid #E2E2E2;border-radius:8px;font-size:13px;font-family:'Montserrat',sans-serif;font-weight:600;color:#434343;outline:none;transition:border-color .2s;text-align:center;letter-spacing:.06em}
.login-input:focus{border-color:#FFDA30}
.login-input::placeholder{color:#C0C0C0;font-weight:500;letter-spacing:.02em}
.login-btn{width:100%;margin-top:12px;padding:13px;background:#FFDA30;border:none;border-radius:8px;font-size:11px;font-weight:800;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;color:#111;transition:background .2s}
.login-btn:hover{background:#FFE870}
.login-btn:disabled{background:#F2F2F2;color:#9A9A9A;cursor:not-allowed}
.login-err{margin-top:10px;font-size:10px;font-weight:700;color:#E84040;letter-spacing:.04em;text-transform:uppercase;min-height:14px}
.login-footer{margin-top:22px;font-size:9px;font-weight:600;color:#9A9A9A;letter-spacing:.08em;text-transform:uppercase}

/* ── Spinner ── */
.lo{position:fixed;inset:0;background:rgba(242,254,220,.82);z-index:8000;display:none;align-items:center;justify-content:center}
.lo.show{display:flex}
.spin{width:36px;height:36px;border:3px solid #FFDA30;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Header ── */
.hdr{background:#473400}
.hdr-in{max-width:1480px;margin:0 auto;padding:16px 28px 0}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.hdr-brand{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.hdr-brand:hover .hdr-title{color:#FFDA30}
.hdr-brand svg{transition:opacity .2s}
.hdr-brand:hover svg{opacity:.85}
.hdr-eyebrow{margin-bottom:4px}
.hdr-el{font-size:9px;font-weight:700;letter-spacing:.16em;color:rgba(255,255,255,.85);text-transform:uppercase}
.hdr-title{font-size:21px;font-weight:800;color:#fff;letter-spacing:.06em;text-transform:uppercase;transition:color .2s}
.hdr-sub{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.1em;margin-top:3px;text-transform:uppercase}
.hdr-right{display:flex;align-items:center;gap:10px;padding-top:4px;flex-wrap:wrap;justify-content:flex-end}
.h-status{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sdot{width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0;transition:background .4s}
.stxt{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.sync-ts{font-size:9px;color:rgba(255,255,255,.45);font-weight:500}
.nexus-btn{padding:5px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font-size:9px;font-weight:700;cursor:pointer;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.08em;transition:all .2s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.nexus-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.yellow-rule{height:3px;background:linear-gradient(90deg,#FFDA30,#FFE870 50%,transparent)}

/* ── Nav strip ── */
.nav-strip{background:#333;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-strip-in{max-width:1480px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-tab-active{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:11px 18px;border-bottom:3px solid transparent;cursor:default}
.nav-strip-right{display:flex;align-items:center;gap:10px;padding:6px 0}

.rfbtn{padding:5px 12px;border-radius:5px;border:1px solid rgba(255,218,48,.4);background:rgba(255,218,48,.12);color:#FFDA30;font-size:9px;font-weight:800;cursor:pointer;font-family:'Montserrat',sans-serif;text-transform:uppercase;letter-spacing:.08em;transition:all .2s}
.rfbtn:hover{background:rgba(255,218,48,.22)}
.rfbtn:disabled{opacity:.4;cursor:not-allowed}

/* ── Main ── */
.main{max-width:1480px;margin:0 auto;padding:22px 28px 48px}
.err-bar{display:none;background:#E84040;color:#fff;font-size:10px;font-weight:700;padding:8px 28px;letter-spacing:.04em}
.err-bar.show{display:block}

/* ── BU section ── */
.bu-section{margin-bottom:28px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #E2E2E2;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.bu-label{background:#473400;color:#FFDA30;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;padding:7px 18px}
.bu-panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);align-items:start}
.panel{border-right:1px solid #E2E2E2}
.panel:last-child{border-right:none}
.panel-title{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#006E5E;padding:6px 14px}

/* ── Achievement table ── */
.ach-table{width:100%;border-collapse:collapse;font-size:12px}
.ach-table th{background:#f5f0e4;color:#473400;padding:7px 12px;text-align:left;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-bottom:1.5px solid #E2E2E2}
.ach-table th.rev-th{text-align:right}
.ach-table td{padding:7px 12px;border-bottom:1px solid #f0ebe0;color:#434343;vertical-align:middle}
.ach-table tbody tr:last-child td{border-bottom:none}
.ach-table tbody tr:hover td{background:#fafaf5}
/* Group header row */
.ach-table tr.grp-hdr td{background:#473400;color:#FFDA30;font-weight:800;font-size:10px;letter-spacing:.07em;padding:6px 12px}
.ach-table tr.grp-hdr:hover td{background:#473400}
/* Subtotal */
.ach-table tr.sub-row td{background:#faf5e6;color:#473400;font-weight:700;font-size:11px;border-top:1px solid #d8cf9a;border-bottom:1.5px solid #d8cf9a}
.ach-table tr.sub-row:hover td{background:#faf5e6}
/* Grand total */
.ach-table tr.grand-row td{background:#FFDA30;color:#473400;font-weight:800;font-size:12px;border-top:2px solid #473400}
.ach-table tr.grand-row:hover td{background:#FFDA30}
/* Cell helpers */
.rev-cell{text-align:right!important;font-variant-numeric:tabular-nums;font-weight:700}
.owner-cell{padding-left:22px!important;color:#666}
.sub-lbl{font-size:9px;letter-spacing:.07em;text-transform:uppercase}
/* Loading */
.ph{padding:40px 20px;text-align:center;color:#bbb;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

@media(max-width:860px){.bu-panels{grid-template-columns:1fr}.panel{border-right:none;border-bottom:1px solid #E2E2E2}.panel:last-child{border-bottom:none}}
@media(max-width:600px){.hdr-in{padding:14px 18px 0}.main{padding:16px 18px 40px}}

function $(id){ return document.getElementById(id); }

/* ═══════════════════════════════════════════════════════════════
   AUTH — localStorage pattern, matches portfolio.html exactly
═══════════════════════════════════════════════════════════════ */
const CLONE_HEAD = (new URLSearchParams(location.search).get('head') || '').toLowerCase().trim();

function getAuthKey(head) {
  return head ? `nexus_auth_${head}` : 'nexus_auth';
}

function checkSSO() {
  const key = getAuthKey(CLONE_HEAD);
  if (localStorage.getItem(key) === '1') { $('login-overlay').style.display = 'none'; return true; }
  // Nevilson uses master password — also accept master auth token
  if (CLONE_HEAD === 'nevilson' && localStorage.getItem('nexus_auth') === '1') {
    $('login-overlay').style.display = 'none'; return true;
  }
  return false;
}

async function doLogin() {
  const btn = $('login-btn'), err = $('login-err'), pw = $('pw-input').value.trim();
  if (!pw) { err.textContent = 'Please enter the access password.'; return; }
  btn.disabled = true; btn.textContent = 'Verifying…'; err.textContent = '';
  try {
    const res  = await fetch('/achievement-desk-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw, head: CLONE_HEAD })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem(getAuthKey(CLONE_HEAD), '1');
      $('login-overlay').style.display = 'none';
      doSync(true);
    } else if (res.status === 500 || data.error) {
      err.textContent = 'Server config error. Contact Mayur.';
    } else {
      err.textContent = 'Incorrect password. Please try again.';
      $('pw-input').value = ''; $('pw-input').focus();
    }
  } catch(e) {
    err.textContent = 'Connection error. Check your network.';
  } finally {
    btn.disabled = false; btn.textContent = 'Access Dashboard';
  }
}

  }
  const LABELS = {
    jiggyasa:'Jiggyasa · Achievement Desk',
    tanuj:'Tanuj · Achievement Desk',
    nevilson:'Nevilson · Achievement Desk',
    jaydeep:'Jaydeep · Achievement Desk'
  };
  const label = LABELS[CLONE_HEAD] || 'Achievement Desk';
  const first = CLONE_HEAD.charAt(0).toUpperCase() + CLONE_HEAD.slice(1);
  document.title = label + ' · Mavlers';
  const ht = $('hdr-title'); if (ht) ht.textContent = label;
  const nl = $('nav-label'); if (nl) nl.textContent = label;
  const le = $('login-eyebrow'); if (le) le.textContent = `Mavlers · ${first}'s Dashboard`;
  const nx = $('nexus-link'); if (nx && CLONE_HEAD) nx.href = `/?head=${CLONE_HEAD}`;
}

/* ═══════════════════════════════════════════════════════════════
   MONTH SELECTOR
═══════════════════════════════════════════════════════════════ */
function populateMonthSelector() {
  const sel = $('month-sel');
  const now = new Date();
  const months = [];
  const cursor = new Date(FY_YEAR, FY_MONTH, 1);
  while (cursor.getFullYear() < now.getFullYear() ||
    (cursor.getFullYear() === now.getFullYear() && cursor.getMonth() <= now.getMonth())) {
    const mn  = cursor.toLocaleString('en-US',{month:'long'});
    months.push({ val:`${mn.toLowerCase()}-${cursor.getFullYear()}`, lbl:`${mn} ${cursor.getFullYear()}` });
    cursor.setMonth(cursor.getMonth()+1);
  }
  months.forEach(m => {
    const o = document.createElement('option');
    o.value = m.val; o.textContent = m.lbl; sel.appendChild(o);
  });
  // Default: last closed month
  const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevVal = `${prev.toLocaleString('en-US',{month:'long'}).toLowerCase()}-${prev.getFullYear()}`;
  sel.value = months.find(m => m.val === prevVal) ? prevVal : months[months.length-1].val;
}

/* ═══════════════════════════════════════════════════════════════
   LINE ITEM CLASSIFIER
═══════════════════════════════════════════════════════════════ */
function classifyLI(raw) {
  const n = (raw||'').toLowerCase().trim();
  if (/^campaign\s*-/.test(n)||n.includes('campaign manager')||n.includes('campaign operation specialist')||n.includes('sfmc'))
    return {svc:'Campaign'};
  if (n==='design - email') return {svc:'Design'};
  if (n.includes('development - email')||n.includes('email coding')) return {svc:'Email'};
  if (n==='design - asset'||/^development\s*-\s*(web|lp|hub|mobile app)/.test(n)||
      n.includes('ai & automation - web')||n.includes('dot-net development')||
      n.includes('operational service - data entry')||/^landing page/.test(n))
    return {svc:'Web'};
  if (/^search\s*-/.test(n)||n.includes('consultancy fees')) return {svc:'Search'};
  if (/^design\s*-/.test(n)) return {svc:'Design'};
  return {svc:null};
}

/* ═══════════════════════════════════════════════════════════════
   FORMAT
═══════════════════════════════════════════════════════════════ */
function fmt(n){ return '$'+Math.round(n||0).toLocaleString('en-US'); }

/* ═══════════════════════════════════════════════════════════════
   API CALLS
═══════════════════════════════════════════════════════════════ */
async function fetchDeals(month) {
  const resp = await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({filters:[{propertyName:'invoice_booking_month',operator:'EQ',value:month}]})});
  if (!resp.ok) throw new Error(`/api ${resp.status}`);
  const data = await resp.json();
  return data.deals||data.results||[];
}
async function fetchLineItems(dealIds) {
  if (!dealIds.length) return {};
  const resp = await fetch('/lineItems',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({dealIds})});
  if (!resp.ok) return {};
  return await resp.json();
}

/* ═══════════════════════════════════════════════════════════════
   ATTRIBUTION
═══════════════════════════════════════════════════════════════ */
function resolveMartechBucket(deal, ownerId) {
  if (ownerId===916030451) return 'Jaydeep NBD';
  if (typeof USER_ROLE_IDS!=='undefined'&&USER_ROLE_IDS.has(ownerId)) {
    if ((deal.user_role_invoice_app||'').trim()==='NBD') return 'Jaydeep NBD';
  }
  const rawGeo=(deal.geo__invoice_app_||'').trim();
  const geo=(typeof resolveGeo!=='undefined'?resolveGeo(rawGeo):null)||
            (typeof OWNER_GEO!=='undefined'?OWNER_GEO[ownerId]:null)||'US';
  if (geo==='AU') return 'Jaydeep AU';
  if (geo==='UK') return 'Jaydeep UK';
  return 'Jaydeep US';
}
function attributeDeals(deals) {
  const seen=new Set();
  deals.forEach(d=>{
    const amt=parseFloat(d.amount||0);
    const name=(d.dealname||'');
    if (amt<=0||EXCL_RE.test(name)){d._excl=true;return;}
    const monthVal=(d.invoice_booking_month||'').toLowerCase();
    const dupKey=`${name}|${amt}|${monthVal}`;
    if (seen.has(dupKey)){d._excl=true;return;}
    seen.add(dupKey);
    const ownerId=parseInt(d.hubspot_owner_id||0);
    if (ownerId===PRATIVA_ID){
      d.bu=(d.business_unit_invoice_app||'').trim()==='MarTech'?'MarTech':'Digital';
    } else {
      d.bu=(typeof MARTECH_OWNER_IDS!=='undefined'&&MARTECH_OWNER_IDS.has(ownerId))?'MarTech':'Digital';
    }
    const rawGeo=(d.geo__invoice_app_||'').trim();
    d.region=(typeof resolveGeo!=='undefined'?resolveGeo(rawGeo):null)||
             (typeof OWNER_GEO!=='undefined'?OWNER_GEO[ownerId]:null)||'US';
    d.head=(typeof OWNER_HEAD_MAP!=='undefined'?OWNER_HEAD_MAP[ownerId]:null)||
           (typeof headFromRegion!=='undefined'?headFromRegion(d.region,d.bu):null)||'';
    if (d.bu==='MarTech') d.martechBucket=resolveMartechBucket(d,ownerId);
    d._amt=amt;
    d._owner=OWNER_DISPLAY[ownerId]||'Other';
    d._excl=false;
  });
}

/* ═══════════════════════════════════════════════════════════════
   DATA BUILDERS
═══════════════════════════════════════════════════════════════ */
function emptyGroups(defs){ const g={}; defs.forEach(({key,label})=>{g[key]={label,owners:{},total:0};}); return g; }

function buildBUData(deals, liMap, groupDefs, buVal, keyFn) {
  const groups=emptyGroups(groupDefs);
  const svcs={Campaign:0,Design:0,Email:0,Search:0,Web:0};
  deals.filter(d=>!d._excl&&d.bu===buVal).forEach(d=>{
    const gKey=keyFn(d);
    if (!gKey||!groups[gKey]) return;
    const grp=groups[gKey];
    grp.owners[d._owner]=(grp.owners[d._owner]||0)+d._amt;
    grp.total+=d._amt;
    (liMap[d.id]||liMap[String(d.id)]||[]).forEach(li=>{
      const liAmt=parseFloat(li.amount||0); if (liAmt<=0) return;
      const {svc}=classifyLI(li.name||li.description||'');
      if (svc&&Object.prototype.hasOwnProperty.call(svcs,svc)) svcs[svc]+=liAmt;
    });
  });
  return {groups,svcs};
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
function visKeys(buId){
  if (!CLONE_HEAD) return null;
  const cfg=CLONE_VISIBLE[CLONE_HEAD]; if (!cfg) return null;
  return cfg[buId]||null;
}

function renderOverall(buId,groups,defs,vis){
  let grand=0,rows='';
  defs.forEach(({key,label})=>{
    if (vis&&!vis.includes(key)) return;
    const g=groups[key]; grand+=g.total;
    rows+=`<tr><td>${label}</td><td class="rev-cell">${fmt(g.total)}</td></tr>`;
  });
  rows+=`<tr class="grand-row"><td>Grand Total</td><td class="rev-cell">${fmt(grand)}</td></tr>`;
  $(buId+'-overall').innerHTML=
    `<div class="panel-title">Overall Achievement</div>
     <table class="ach-table"><thead><tr><th>Head</th><th class="rev-th">Revenue</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderIndividual(buId,groups,defs,vis){
  let grand=0,tbody='';
  defs.forEach(({key,label})=>{
    if (vis&&!vis.includes(key)) return;
    const g=groups[key]; grand+=g.total;
    tbody+=`<tr class="grp-hdr"><td colspan="3">${label}</td></tr>`;
    Object.entries(g.owners).sort((a,b)=>b[1]-a[1]).forEach(([n,r])=>{
      tbody+=`<tr><td></td><td class="owner-cell">${n}</td><td class="rev-cell">${fmt(r)}</td></tr>`;
    });
    tbody+=`<tr class="sub-row"><td></td><td class="sub-lbl">Subtotal</td><td class="rev-cell">${fmt(g.total)}</td></tr>`;
  });
  tbody+=`<tr class="grand-row"><td colspan="2">Grand Total</td><td class="rev-cell">${fmt(grand)}</td></tr>`;
  $(buId+'-individual').innerHTML=
    `<div class="panel-title">Individual Owner Achievement</div>
     <table class="ach-table"><thead><tr><th>Head</th><th>Owner</th><th class="rev-th">Revenue</th></tr></thead><tbody>${tbody}</tbody></table>`;
}

function renderService(buId,svcs){
  const ORDER=['Campaign','Design','Email','Search','Web'];
  let grand=0,rows='';
  ORDER.forEach(s=>{ grand+=svcs[s]; rows+=`<tr><td>${s}</td><td class="rev-cell">${fmt(svcs[s])}</td></tr>`; });
  rows+=`<tr class="grand-row"><td>Grand Total</td><td class="rev-cell">${fmt(grand)}</td></tr>`;
  $(buId+'-service').innerHTML=
    `<div class="panel-title">Service Vertical Achievement</div>
     <table class="ach-table"><thead><tr><th>Service</th><th class="rev-th">Revenue</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderBU(buId,data,defs){
  const vis=visKeys(buId);
  renderOverall(buId,data.groups,defs,vis);
  renderIndividual(buId,data.groups,defs,vis);
  renderService(buId,data.svcs);
}

/* ═══════════════════════════════════════════════════════════════
   SYNC
═══════════════════════════════════════════════════════════════ */
let isSyncing=false;

async function doSync(initial) {
  if (isSyncing) return;
  isSyncing=true;
  const rfbtn2=$('rfbtn'); if (rfbtn2) rfbtn2.disabled=true;
  $('lo').classList.add('show');
  $('sdot').style.background='#FFDA30';
  $('stxt').textContent='FETCHING…';
  $('err-bar').classList.remove('show');

  const month=$('month-sel').value;
  try {
    const deals=await fetchDeals(month);
    attributeDeals(deals);
    const validIds=deals.filter(d=>!d._excl).map(d=>String(d.id));
    const liMap=validIds.length?await fetchLineItems(validIds):{};

    const digitalData=buildBUData(deals,liMap,DIGITAL_GROUPS,'Digital',d=>d.head);
    const martechData=buildBUData(deals,liMap,MARTECH_GROUPS,'MarTech',d=>d.martechBucket);

    renderBU('digital',digitalData,DIGITAL_GROUPS);
    renderBU('martech',martechData,MARTECH_GROUPS);

    $('main-content').style.display='block';
    $('nav-strip').style.display='';
    $('sdot').style.background='#FFDA30';
    const validCount=deals.filter(d=>!d._excl).length;
    const monthLabel=month.replace('-',' ').replace(/\b\w/g,c=>c.toUpperCase());
    $('stxt').textContent=monthLabel+' · '+validCount+' DEALS';
    const ts=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    $('sync-ts').textContent='Synced at '+ts;
  } catch(e) {
    console.error('[Achievement Desk]',e);
    $('sdot').style.background='#E84040';
    $('stxt').textContent='SYNC FAILED';
    $('err-bar').textContent='Failed to load: '+e.message;
    $('err-bar').classList.add('show');
    $('main-content').style.display='block';
    $('nav-strip').style.display='';
  } finally {
    isSyncing=false;
    $('lo').classList.remove('show');
    if (rfbtn2) rfbtn2.disabled=false;
  }
}

/* ═══════════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async ()=>{
  bootCloneMode();
  populateMonthSelector();
  $('month-sel').addEventListener('change', ()=>doSync());

  const authed=checkSSO();
  if (!authed) return; // Wait for manual login

  await initRegistry();
  await doSync(true);
});
</script>
